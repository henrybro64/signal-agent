agent:
  timezone: Asia/Taipei
  digest_time: "20:00"

tasks:
  job_search:
    enabled: true
    sources:
      - job104
      - linkedin_email
    keywords:
      - python
      - backend
      - agent
    locations:
      - Taiwan
  tw_stock_movers:
    enabled: true
    top_n: 20
    timezone: Asia/Taipei

notifiers:
  telegram:
    enabled: true
    failure_alerts_enabled: true

scoring:
  freshness_weight: 0.6
  priority_weight: 0.4
  llm_enabled: false
  llm_model: gpt-4o-mini

# Optional source runtime tuning. Safe defaults apply when this section
# (or any nested key) is omitted.
sources:
  job104:
    timeout_seconds: 10
    max_retries: 2
    request_delay_seconds: 1.0
    page_limit: 1
  indeed:
    timeout_seconds: 10
    max_retries: 2
    request_delay_seconds: 1.0
    page_limit: 1
  glassdoor:
    timeout_seconds: 10
    max_retries: 2
    request_delay_seconds: 1.0
    page_limit: 1
  linkedin_email:
    lookback_days: 14
  twse:
    timeout_seconds: 10
    max_retries: 2
    request_delay_seconds: 0.2
    batch_size: 100
  tpex:
    timeout_seconds: 10
    max_retries: 2
    request_delay_seconds: 0.2
    batch_size: 100
