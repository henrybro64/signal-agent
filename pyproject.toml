[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-agent"
version = "0.1.0"
description = "Personal signal agent for job search and Taiwan stock digests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "jsonschema>=4.23,<5",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.6.9",
]
langchain = [
    "langchain-core>=0.3,<2",
    "langgraph>=0.2,<2",
    "pydantic>=2,<3",
]
mcp = [
    "mcp>=1.0,<2",
]
browser = [
    "playwright>=1.40,<2",
]

[project.scripts]
signal-agent = "app.cli:main"
signal-agent-eval = "app.evaluation.runner:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.profiles" = ["*.md"]
"app.data" = ["*.yaml"]
"app.sql" = ["migrations/*.sql"]
"app.evaluation" = ["cases/*.yaml", "fixtures/*"]
"app.skills" = ["builtin/*.yaml"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
