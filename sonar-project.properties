# SonarCloud Automatic Analysis settings for signal-agent.
# Parallel deploy manifests, large task fixtures, and SQL migration/docs
# pairs inflate new-code CPD without reflecting production maintainability.
sonar.exclusions=**/tests/**,**/deploy/**,**/sql/**,**/app/sql/**
sonar.cpd.exclusions=**/tests/**,**/deploy/**,**/sql/**,**/app/sql/**
