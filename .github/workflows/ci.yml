name: CI

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pin pip to a verified version (Sonar githubactions:S8544).
      - name: Upgrade pip
        run: python -m pip install --upgrade pip==26.1.2

      - name: Install dependencies
        run: make install-dev PYTHON=python

      - name: Run tests
        run: make test PYTHON=python

      - name: Run lint
        run: make lint PYTHON=python

      - name: Run package smoke test
        run: make package-smoke PYTHON=python
