api_version: 1
name: browser
version: "1.2.0"
description: >
  Optional isolated browser tools with domain policy and interactive
  session navigation via fake fixtures or Playwright (disabled by
  default; per-tool ask, execute class stays disabled).
tools:
  - browser_navigate
  - browser_read_page
  - browser_screenshot
  - browser_open
  - browser_snapshot
  - browser_click
  - browser_type
  - browser_select
  - browser_scroll
  - browser_back
  - browser_close
tasks: []
workflows: []
required_permissions:
  - execute
# Playwright is optional (backend: playwright / .[browser]); fake sessions
# work without the extra. Doctor reports Playwright readiness separately.
python_extras: []
config_schema:
  type: object
  properties:
    browser.enabled:
      type: boolean
compatibility:
  min_api_version: 1
  max_api_version: 1
