# Taiwan stock market no-trade dates (TWSE / TPEx).
# Source: Taiwan Stock Exchange holiday schedule (https://www.twse.com.tw/).
# Update annually when TWSE publishes the next year's calendar.
# Include settlement-only (no trading) days, public holidays, and announced
# ad-hoc closures (e.g. typhoon). Years with no rows fail closed at runtime.
# Weekends do not need to be listed; the market-hours guard already skips them.
#
# 2026: TWSE official holidaySchedule open data.
# 2027: provisional (TWSE had not published queryYear=2027 as of 2026-10).
#        Based on Executive Yuan calendar + TAIFEX Spring Festival block +
#        historical settlement-day pattern. Replace with TWSE open data when
#        available and re-run doctor.
