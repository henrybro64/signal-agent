version = 1

# Keep DeepSource focused on product code for this repo's quality gate.
exclude_patterns = [
  "tests/**",
  "docs/**",
  ".venv/**",
]

[[analyzers]]
name = "python"

  [analyzers.meta]
  cyclomatic_complexity_threshold = "very-high"

[[analyzers]]
name = "docker"

[[analyzers]]
name = "shell"

[[analyzers]]
name = "sql"

[[analyzers]]
name = "secrets"
