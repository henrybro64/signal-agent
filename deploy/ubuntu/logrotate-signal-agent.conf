# Optional host logrotate snippet for cron-wrapper logs (#104).
# Install (as root), adjusting the path to your project:
#
#   sudo cp deploy/ubuntu/logrotate-signal-agent.conf \
#     /etc/logrotate.d/signal-agent
#
# The local runtime JSON log (`logs/signal-agent.log`) is rotated in-process
# by RotatingFileHandler (SIGNAL_AGENT_LOG_MAX_BYTES /
# SIGNAL_AGENT_LOG_BACKUP_COUNT). Do not copytruncate that file — a second
# rotator desyncs the open handler from the path `signal-agent logs` tails.
#
# These patterns cover the unbounded append logs from
# deploy/ubuntu/run-*.sh (see crontab.example).
/opt/signal-agent/logs/job_search.log
/opt/signal-agent/logs/tw_stock_movers.log
/opt/signal-agent/logs/stock_watchlist.log
{
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    maxsize 5M
}
