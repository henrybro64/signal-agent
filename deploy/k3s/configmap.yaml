apiVersion: v1
kind: ConfigMap
metadata:
  name: signal-agent-config
  namespace: signal-agent
  labels:
    app.kubernetes.io/name: signal-agent
data:
  config.yaml: |
    agent:
      timezone: Asia/Taipei
      digest_time: "20:00"

    tasks:
      job_search:
        enabled: true
        sources:
          - job104
          - linkedin_email
        keywords:
          - python
          - backend
          - agent
        locations:
          - Taiwan
      tw_stock_movers:
        enabled: true
        top_n: 20
        timezone: Asia/Taipei
      # Optional personal watchlist alerts (disabled until symbols are filled in).
      stock_watchlist:
        enabled: false
        timezone: Asia/Taipei
        sources:
          - twse
          - tpex
        symbols:
          - code: "2330"
            name: 台積電
            alert_change_percent_abs: 2.0
          - code: "3081"
            name: 聯亞
            alert_change_percent_abs: 3.0
        themes:
          AI_infrastructure:
            symbols: ["2330"]
          CPO_optical:
            symbols: ["3081"]
      # Research-oriented market assistant (reuses TWSE/TPEx movers).
      # Disabled by default; enable locally or schedule a CronJob when ready.
      tw_market_assistant:
        enabled: false
        timezone: Asia/Taipei
        market_hours_only: true
        top_n: 20
        notify_language: zh-TW
        sources:
          - twse
          - tpex
      # Bounded job-research pilot (#64). Prefer deterministic job_search for
      # production digests; enable Telegram delivery only after review.
      job_research_agent:
        enabled: true
        telegram_enabled: false
        max_steps: 12
        max_tool_calls: 6
        max_llm_calls: 3
        memory_namespace: job_research
        # Optional per-workflow model override (#86); omit to inherit llm.*
        # llm_provider: fake
        # llm_model: research-model

    # Explicit Markdown/text documents for namespaced agent memory (#65).
    # Paths are ingested at job_research start; never put .env/secrets here.
    # Leave empty in deployment-safe defaults; local runs can point at
    # app/evaluation/fixtures/company-notes.md when experimenting with RAG.
    memory:
      namespaces:
        job_research:
          documents: []

    investment:
      watchlist:
        - "2330"
        - "2454"
      theme_mappings:
        ai_server:
          label: AI伺服器
          keywords:
            - 伺服器
            - AI
            - GPU
            - 散熱
            - 機殼
            - 電源
        cpo_optical:
          label: CPO / 光通訊
          keywords:
            - 光通訊
            - CPO
            - 光纖
            - 矽光子
            - transceiver
        semiconductor:
          label: 半導體
          keywords:
            - 晶圓
            - 封測
            - IC
            - ASIC
            - CoWoS
            - HBM

    notifiers:
      telegram:
        enabled: true
        failure_alerts_enabled: true

    scoring:
      freshness_weight: 0.6
      priority_weight: 0.4
      llm_enabled: false
      # Kept in sync with llm.model (alias for older configs).
      llm_model: gpt-4o-mini

    # Optional LLM gateway defaults (used when scoring.llm_enabled is true).
    # llm.model is the source of truth; provider "fake" is for offline tests;
    # "ollama" is reserved for later.
    llm:
      provider: openai
      model: gpt-4o-mini
      timeout_seconds: 20
      temperature: 0.2
      max_retries: 1
      # Optional ordered fallbacks used by RoutedLLMProvider (#86).
      # fallbacks:
      #   - fake/backup-model

    # Optional agent tool registry defaults (#62/#84). Telegram stays off the
    # default allowlist; enable via include path / job_research_agent.telegram_enabled.
    tools:
      allowlist:
        - search_jobs
        - get_tw_stock_movers
        - query_recent_runs
      timeout_seconds: 30
      permissions:
        classes:
          read: allow
          notify: ask
          write: disabled
          execute: disabled
        # Per-tool overrides (disabled/ask/allow), e.g.:
        # tools:
        #   send_telegram_message: allow
        max_side_effect_actions: 3

    # Optional isolated browser service (#87). Disabled by default.
    # To use: skill enable browser → set enabled: true → browser start/test.
    # Downloads always denied; fake backend only when explicitly configured.
    browser:
      enabled: false
      headless: true
      # backend: fake   # force offline fixtures (also via SIGNAL_AGENT_BROWSER_BACKEND)
      allowed_domains:
        - fixture.local
        - example.com
      denied_domains: []
      navigation_timeout_seconds: 15
      max_page_bytes: 500000
      allow_downloads: false
      allow_javascript: false

    # Built-in skills (#89). Omit `enabled` to use defaults (job_search +
    # stock_monitoring). Browser stays off until explicitly enabled.
    skills:
      enabled:
        - job_search
        - stock_monitoring

    # Optional source runtime tuning. Safe defaults apply when this section
    # (or any nested key) is omitted.
    sources:
      job104:
        timeout_seconds: 10
        max_retries: 2
        request_delay_seconds: 1.0
        page_limit: 1
      indeed:
        timeout_seconds: 10
        max_retries: 2
        request_delay_seconds: 1.0
        page_limit: 1
      glassdoor:
        timeout_seconds: 10
        max_retries: 2
        request_delay_seconds: 1.0
        page_limit: 1
      linkedin_email:
        lookback_days: 14
      twse:
        timeout_seconds: 10
        max_retries: 2
        request_delay_seconds: 0.2
        batch_size: 100
      tpex:
        timeout_seconds: 10
        max_retries: 2
        request_delay_seconds: 0.2
        batch_size: 100
