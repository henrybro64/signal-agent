apiVersion: batch/v1
kind: CronJob
metadata:
  name: tw-stock-movers-every-10-min
  namespace: signal-agent
  labels:
    app.kubernetes.io/name: signal-agent
    app.kubernetes.io/component: tw-stock-movers
spec:
  timeZone: Asia/Taipei
  # Run every 10 minutes on weekdays. Each task still checks Taiwan market hours
  # internally, so off-hours runs no-op. stock_watchlist also stays quiet while
  # tasks.stock_watchlist.enabled is false in config.
  schedule: "*/10 * * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: signal-agent
            app.kubernetes.io/component: tw-stock-movers
        spec:
          restartPolicy: Never
          containers:
            - name: signal-agent
              image: signal-agent:local
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -lc
                - |
                  set -eu
                  status=0
                  python main.py --task tw_stock_movers --config /app/config.yaml || status=$?
                  python main.py --task stock_watchlist --config /app/config.yaml || status=$?
                  exit "$status"
              env:
                - name: SIGNAL_AGENT_ENV
                  value: production
              envFrom:
                - secretRef:
                    name: signal-agent-secrets
              volumeMounts:
                - name: config
                  mountPath: /app/config.yaml
                  subPath: config.yaml
                  readOnly: true
                - name: data
                  mountPath: /app/data
          volumes:
            - name: config
              configMap:
                name: signal-agent-config
                items:
                  - key: config.yaml
                    path: config.yaml
            - name: data
              persistentVolumeClaim:
                claimName: signal-agent-data
