apiVersion: batch/v1
kind: CronJob
metadata:
  name: job-search-daily
  namespace: signal-agent
  labels:
    app.kubernetes.io/name: signal-agent
    app.kubernetes.io/component: job-search
spec:
  # Run at 08:00 and 18:00 every day.
  # This cron expression assumes the cluster evaluates schedules in Asia/Taipei.
  schedule: "0 8,18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: signal-agent
            app.kubernetes.io/component: job-search
        spec:
          restartPolicy: Never
          containers:
            - name: signal-agent
              image: signal-agent:local
              imagePullPolicy: IfNotPresent
              command:
                - python
                - main.py
                - --task
                - job_search
                - --config
                - /app/config.yaml
              env:
                - name: SIGNAL_AGENT_ENV
                  value: production
              envFrom:
                - secretRef:
                    name: signal-agent-secrets
              volumeMounts:
                - name: config
                  mountPath: /app/config.yaml
                  subPath: config.yaml
                  readOnly: true
                - name: data
                  mountPath: /app/data
          volumes:
            - name: config
              configMap:
                name: signal-agent-config
                items:
                  - key: config.yaml
                    path: config.yaml
            - name: data
              persistentVolumeClaim:
                claimName: signal-agent-data
